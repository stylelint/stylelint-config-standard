name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    uses: stylelint/.github/.github/workflows/call-lint.yml@53e95ed8e6b1e8ee8883831a066b2061be35bd37 # 1.2.0
    permissions:
      contents: read

  test:
    uses: stylelint/.github/.github/workflows/call-test.yml@53e95ed8e6b1e8ee8883831a066b2061be35bd37 # 1.2.0
    permissions:
      contents: read

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: stylelint/.github/.github/workflows/call-dependency-review.yml@53e95ed8e6b1e8ee8883831a066b2061be35bd37 # 1.2.0
    permissions:
      contents: read
