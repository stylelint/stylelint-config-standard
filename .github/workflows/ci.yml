name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    uses: stylelint/.github/.github/workflows/call-lint.yml@c7bd02a469ce20d1f3a35b7561b99262cba9a683 # 2.0.0
    permissions:
      contents: read

  test:
    uses: stylelint/.github/.github/workflows/call-test.yml@c7bd02a469ce20d1f3a35b7561b99262cba9a683 # 2.0.0
    permissions:
      contents: read

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: stylelint/.github/.github/workflows/call-dependency-review.yml@c7bd02a469ce20d1f3a35b7561b99262cba9a683 # 2.0.0
    permissions:
      contents: read
